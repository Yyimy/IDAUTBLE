name: Package Windows shortcut reconnect
on:
  push:
    branches: [verify/windows-shortcut-reconnect]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: tools/windows-hid-shortcut
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - run: python -c "from idaut_lectura import barcode_icon; barcode_icon().save('shortcut.ico')"
      - run: python -m PyInstaller --noconfirm --onefile --windowed --icon shortcut.ico --name "IS-P Shortcut" --collect-submodules bleak.backends.winrt --collect-submodules pystray idaut_lectura.py
      - uses: actions/upload-artifact@v4
        with:
          name: IS-P-Shortcut-Windows
          path: tools/windows-hid-shortcut/dist/IS-P Shortcut.exe
          if-no-files-found: error
