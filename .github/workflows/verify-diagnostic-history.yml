name: Verify PLC diagnostic history
on:
  push:
    branches: [verify/diagnostic-history]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 36 if needed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager "platforms;android-36"
          fi
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Diagnostic-history
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install the documented firmware toolchain
        run: |
          index=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$index"
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls "$index"
          arduino-cli lib install 'Adafruit BusIO@1.16.2'
          arduino-cli lib install --no-deps 'Adafruit ADS1X15@2.5.0'
      - name: Compile firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,PartitionScheme=min_spiffs firmware/PLC_Scanner_v3 --warnings all --output-dir firmware-build
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-Diagnostic-history
          path: firmware-build/PLC_Scanner_v3.ino.bin
          if-no-files-found: error
