name: Verify PCC and CC HID settings
on:
  push:
    branches: [verify/hid-output-mode-settings]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager "platforms;android-36"
          fi
      - name: Test and compile the Android app
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-PCC-CC-HID-Settings
          path: android/app/build/outputs/apk/debug/*.apk
