name: Verify PCC/CC sound settings
on:
  push:
    branches: [verify/pcc-cc-sounds]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run firmware host regressions
        run: |
          set -e
          python3 firmware/tests/test_logic.py
          python3 firmware/tests/test_pin_constant.py
          for test in firmware_pcc_cc/tests/test_*.py; do
            python3 "$test"
          done
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Compile ESP32-S3 with Arduino-ESP32 3.0.7
        run: |
          index=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$index"
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls "$index"
          arduino-cli lib install 'Adafruit BusIO@1.16.2'
          arduino-cli lib install --no-deps 'Adafruit ADS1X15@2.5.0'
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,PartitionScheme=min_spiffs firmware_pcc_cc/PLC_Scanner_v3 --warnings all --output-dir firmware-build
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-PCC-CC-Sounds
          path: firmware-build/
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager "platforms;android-36"
          fi
      - name: Test and compile the Android app
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-PCC-CC-Sounds
          path: android/app/build/outputs/apk/debug/*.apk
