name: Verify IDAUT Lectura reconnect and manoeuvre
on:
  push:
    branches: [verify/windows-shortcut-reconnect-manoeuvre]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package IDAUT Lectura
        working-directory: tools/windows-hid-shortcut
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.14.2
          python -m py_compile idaut_lectura.py
          python -c "from idaut_lectura import barcode_icon; barcode_icon().save('shortcut.ico')"
          python -m PyInstaller --icon shortcut.ico --noconfirm --onefile --windowed --name IDAUT_Lectura --collect-submodules bleak.backends.winrt --collect-submodules pystray idaut_lectura.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-IDAUT-Lectura-Reconnect-Manoeuvre
          path: tools/windows-hid-shortcut/dist/IDAUT_Lectura.exe
